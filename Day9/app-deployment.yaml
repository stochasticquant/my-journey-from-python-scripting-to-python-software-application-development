# deployments/kubernetes/app-deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory-app
  namespace: inventory-system
spec:
  replicas: 3
  selector:
    matchLabels:
      app: inventory-app
  template:
    metadata:
      labels:
        app: inventory-app
    spec:
      containers:
      - name: app
        image: your-registry/inventory-system:latest
        ports:
        - containerPort: 8000
        env:
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: inventory-secrets
              key: db-password
        - name: SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: inventory-secrets
              key: secret-key
        - name: DB_HOST
          valueFrom:
            configMapKeyRef:
              name: inventory-config
              key: db-host
        - name: DB_PORT
          valueFrom:
            configMapKeyRef:
              name: inventory-config
              key: db-port
        - name: DB_NAME
          valueFrom:
            configMapKeyRef:
              name: inventory-config
              key: db-name
        - name: DB_USER
          valueFrom:
            configMapKeyRef:
              name: inventory-config
              key: db-user
        - name: APP_PORT
          valueFrom:
            configMapKeyRef:
              name: inventory-config
              key: app-port
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 5
