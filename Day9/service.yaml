# deployments/kubernetes/service.yaml
apiVersion: v1
kind: Service
metadata:
  name: sqlserver-service
  namespace: inventory-system
spec:
  selector:
    app: sqlserver
  ports:
  - port: 1433
    targetPort: 1433
---
apiVersion: v1
kind: Service
metadata:
  name: app-service
  namespace: inventory-system
spec:
  type: LoadBalancer
  selector:
    app: inventory-app
  ports:
  - port: 80
    targetPort: 8000
